apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: payments}
  template:
    metadata:
      labels: {app: payments}
    spec:
      containers:
        - name: payments
          image: REPO/payments:latest
          env:
            - {name: LATENCY_MS, value: "150"}
          resources:
            requests: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            tcpSocket: {port: 8000}
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: demo
spec:
  selector: {app: payments}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bad
  namespace: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad
  namespace: demo
spec:
  replicas: 2
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: bad}
  template:
    metadata:
      labels: {app: bad}
    spec:
      serviceAccountName: bad
      nodeSelector: {cloud.google.com/gke-nodepool: bad}
      tolerations: [{key: side, value: bad, effect: NoSchedule}]
      containers:
        - name: bad
          image: REPO/bad:latest
          env:
            - {name: PAYMENTS_URL, value: http://payments/charge}
            - {name: CATALOG_URI, value: CATALOG_URI_VALUE}
            - {name: LOG_LEVEL, value: DEBUG}
          resources:
            requests: {cpu: "1", memory: MEMORY_LIMIT}
            limits: {cpu: "1", memory: MEMORY_LIMIT}
---
apiVersion: v1
kind: Service
metadata:
  name: bad
  namespace: demo
spec:
  selector: {app: bad}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: good
  namespace: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: good
  namespace: demo
spec:
  replicas: 2
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: good}
  template:
    metadata:
      labels: {app: good}
    spec:
      serviceAccountName: good
      nodeSelector: {cloud.google.com/gke-nodepool: good}
      tolerations: [{key: side, value: good, effect: NoSchedule}]
      securityContext: {runAsNonRoot: true}
      containers:
        - name: good
          image: REPO/good:latest
          env:
            - {name: PAYMENTS_URL, value: http://payments/charge}
            - {name: CATALOG_URI, value: CATALOG_URI_VALUE}
            - {name: LOG_LEVEL, value: INFO}
            - name: PYTHON_CPU_COUNT
              valueFrom:
                resourceFieldRef: {resource: limits.cpu, divisor: "1"}
          resources:
            requests: {cpu: "1", memory: MEMORY_LIMIT}
            limits: {cpu: "1", memory: MEMORY_LIMIT}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 2
          lifecycle:
            preStop:
              sleep: {seconds: 5}
---
apiVersion: v1
kind: Service
metadata:
  name: good
  namespace: demo
spec:
  selector: {app: good}
  ports: [{port: 80, targetPort: 8000}]
