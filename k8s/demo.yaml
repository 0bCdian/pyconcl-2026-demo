---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arena
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: arena}
  template:
    metadata:
      labels: {app: arena}
    spec:
      containers:
        - name: arena
          image: REPO/arena:latest
