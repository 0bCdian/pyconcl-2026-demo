apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: payments}
  template:
    metadata:
      labels: {app: payments}
    spec:
      containers:
        - name: payments
          image: REPO/payments:latest
          env:
            - {name: LATENCY_MS, value: "150"}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: postgres-app, key: uri}}
          resources:
            requests: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            tcpSocket: {port: 8000}
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: demo
spec:
  selector: {app: payments}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: demo
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-minimal-trixie
  postgresql:
    parameters:
      max_connections: "1000"
  bootstrap:
    initdb:
      database: shop
      owner: shop
      # The schema below runs as postgres: without this grant the shop role cannot use its own tables.
      postInitApplicationSQL:
        - alter default privileges in schema public grant all on tables to shop
      postInitApplicationSQLRefs:
        configMapRefs:
          - {name: db-schema, key: schema.sql}
  storage:
    size: 10Gi
  resources:
    requests: {cpu: 500m, memory: 1Gi}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bad
  namespace: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad
  namespace: demo
spec:
  replicas: 2
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: bad}
  template:
    metadata:
      labels: {app: bad}
    spec:
      serviceAccountName: bad
      nodeSelector: {cloud.google.com/gke-nodepool: bad}
      tolerations: [{key: side, value: bad, effect: NoSchedule}]
      terminationGracePeriodSeconds: 40
      containers:
        - name: bad
          image: REPO/bad:latest
          env:
            - {name: PAYMENTS_URL, value: http://payments/charge}
            - {name: CATALOG_URI, value: CATALOG_URI_VALUE}
            - {name: LOG_LEVEL, value: INFO}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: postgres-app, key: uri}}
            - name: SHOP_NAME
              valueFrom: {fieldRef: {fieldPath: "metadata.labels['app']"}}
          resources:
            requests: {cpu: "1", memory: MEMORY_LIMIT}
            limits: {cpu: "1", memory: MEMORY_LIMIT}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 2
          lifecycle:
            preStop:
              sleep: {seconds: 15}
---
apiVersion: v1
kind: Service
metadata:
  name: bad
  namespace: demo
spec:
  selector: {app: bad}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: v1
