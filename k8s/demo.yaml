---
apiVersion: v1
kind: Service
metadata:
  name: good
  namespace: demo
spec:
  selector: {app: good}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arena
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: arena}
  template:
    metadata:
      labels: {app: arena}
    spec:
      containers:
        - name: arena
          image: REPO/arena:latest
          resources:
            requests: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
---
apiVersion: v1
kind: Service
metadata:
  name: arena
  namespace: demo
spec:
  selector: {app: arena}
  ports: [{port: 80, targetPort: 8000}]
