            - {name: CATALOG_URI, value: CATALOG_URI_VALUE}
            - {name: LOG_LEVEL, value: INFO}
            - {name: DATABASE_URL, value: postgresql://shop:shop@postgres/shop}
            - name: SHOP_NAME
