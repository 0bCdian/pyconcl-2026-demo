apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: payments}
  template:
    metadata:
      labels: {app: payments}
    spec:
      containers:
        - name: payments
          image: REPO/payments:latest
          env:
            - {name: LATENCY_MS, value: "150"}
            - {name: DATABASE_URL, value: postgresql://shop:shop@postgres/shop}
          resources:
            requests: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            tcpSocket: {port: 8000}
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: demo
spec:
  selector: {app: payments}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:17
          args: ["-c", "max_connections=1000"]
          env:
            - {name: POSTGRES_USER, value: shop}
            - {name: POSTGRES_PASSWORD, value: shop}
            - {name: POSTGRES_DB, value: shop}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
          readinessProbe:
            exec: {command: [pg_isready, -U, shop, -d, shop]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: schema, mountPath: /docker-entrypoint-initdb.d}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: schema, configMap: {name: db-schema}}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: demo
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bad
  namespace: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad
  namespace: demo
spec:
  replicas: 2
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: bad}
  template:
    metadata:
      labels: {app: bad}
    spec:
      serviceAccountName: bad
      nodeSelector: {cloud.google.com/gke-nodepool: bad}
      tolerations: [{key: side, value: bad, effect: NoSchedule}]
      terminationGracePeriodSeconds: 40
      containers:
        - name: bad
          image: REPO/bad:latest
          env:
            - {name: PAYMENTS_URL, value: http://payments/charge}
            - {name: CATALOG_URI, value: CATALOG_URI_VALUE}
            - {name: LOG_LEVEL, value: INFO}
            - {name: DATABASE_URL, value: postgresql://shop:shop@postgres/shop}
            - name: SHOP_NAME
              valueFrom: {fieldRef: {fieldPath: "metadata.labels['app']"}}
          resources:
            requests: {cpu: "1", memory: MEMORY_LIMIT}
            limits: {cpu: "1", memory: MEMORY_LIMIT}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 2
          lifecycle:
            preStop:
              sleep: {seconds: 15}
---
apiVersion: v1
kind: Service
metadata:
  name: bad
  namespace: demo
spec:
  selector: {app: bad}
  ports: [{port: 80, targetPort: 8000}]
---
