alertmanager: {enabled: false}
nodeExporter: {enabled: false}
defaultRules: {create: false}
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeEtcd: {enabled: false}
kubeProxy: {enabled: false}

prometheus:
  prometheusSpec:
    enableRemoteWriteReceiver: true
    scrapeInterval: 10s

grafana:
  adminPassword: pycon
  grafana.ini:
    auth.anonymous: {enabled: true, org_role: Viewer}
    security: {allow_embedding: true}
    server: {root_url: "http://localhost:8001/api/v1/namespaces/monitoring/services/kps-grafana:80/proxy/"}
    dashboards: {default_home_dashboard_path: /tmp/dashboards/shop.json}
