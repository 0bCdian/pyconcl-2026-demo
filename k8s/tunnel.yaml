apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunnel
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: tunnel}
  template:
    metadata:
      labels: {app: tunnel}
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.7
          args: [tunnel, --no-autoupdate, --url, http://arena]
          resources:
            requests: {cpu: 100m, memory: 64Mi}
