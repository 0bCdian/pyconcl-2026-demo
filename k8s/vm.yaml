apiVersion: v1
kind: Service
metadata:
  name: payments-vm
  namespace: demo
spec:
  type: NodePort
  selector: {app: payments}
  ports: [{port: 80, targetPort: 8000, nodePort: 30080}]
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-vm
  namespace: demo
spec:
  type: NodePort
  selector: {cnpg.io/cluster: postgres, cnpg.io/instanceRole: primary}
  ports: [{port: 5432, nodePort: 30432}]
