<!doctype html><html lang="es"><meta charset="utf-8"><title>Manifiesto</title>
<style>
*{box-sizing:border-box;margin:0}body{width:1600px;height:900px;background:#f3f4f2;color:#121314;font-family:"Archivo","Helvetica Neue",Arial,sans-serif;overflow:hidden;position:relative}
.box{position:absolute;top:150px;width:600px;height:560px;padding:36px 40px;color:#fff;
background:repeating-linear-gradient(90deg,rgba(0,0,0,.16) 0 10px,rgba(255,255,255,.06) 10px 30px,rgba(0,0,0,.0) 30px 44px)}
.a{left:80px;background-color:#e2571e}.b{left:720px;background-color:#1d4e89}
.code{font-family:"Big Shoulders Stencil Display",Impact,sans-serif;font-size:64px;font-weight:800;letter-spacing:.04em}
.csc{position:absolute;left:40px;bottom:40px;width:300px;height:150px;background:#d9dcd8;border:3px solid #121314}
.big{position:absolute;right:40px;bottom:40px;font-family:"Big Shoulders Stencil Display",Impact,sans-serif;font-size:150px;font-weight:900;line-height:.9}
h1{position:absolute;left:80px;top:40px;font-size:64px;font-weight:900;letter-spacing:-.01em}
.side{position:absolute;right:80px;top:150px;width:300px}
.qr{width:300px;height:300px;background:#121314;border:18px solid #fff;outline:3px solid #121314}
.lab{font-size:28px;font-weight:800;margin-top:20px}
.ev{position:absolute;left:80px;bottom:60px;font-size:34px;font-weight:800}
</style>
<h1>Misma app, dos resultados distintos</h1>
<div class="box a"><div class="code">PYCU 202611 4</div><div class="csc"></div><div class="big">A</div></div>
<div class="box b"><div class="code">PYCU 202615 6</div><div class="csc"></div><div class="big">B</div></div>
<div class="side"><div class="qr"></div><div class="lab">Escanea y carga una orden</div></div>
<div class="ev">PyCon Chile 2026 · 14 nov · Santiago</div>
</html>
