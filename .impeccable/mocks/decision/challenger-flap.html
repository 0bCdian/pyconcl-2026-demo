<!doctype html><html lang="es"><meta charset="utf-8"><title>Salidas</title>
<style>
*{box-sizing:border-box;margin:0}body{width:1600px;height:900px;background:#8e959b;color:#fff;font-family:"Barlow Condensed","Helvetica Neue",Arial,sans-serif;overflow:hidden;position:relative}
.board{position:absolute;inset:60px 80px;background:#141516;padding:40px;border:10px solid #b9bfc4}
h1{font-size:64px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:30px}
.row{display:grid;grid-template-columns:200px 1fr 260px;gap:12px;margin-bottom:16px}
.c{background:#1f2021;height:84px;border-bottom:3px solid #000;font-size:56px;font-weight:700;padding:6px 16px;text-transform:uppercase}
.amb{color:#ffb22e}.red{color:#a33a35}
</style>
<div class="board"><h1>Salidas · Misma app, dos resultados distintos</h1>
<div class="row"><div class="c">A</div><div class="c">app.py → 17 workers</div><div class="c red">Demorado</div></div>
<div class="row"><div class="c">B</div><div class="c">app.py → 1 proceso</div><div class="c amb">A tiempo</div></div>
<div class="row"><div class="c"></div><div class="c">PyCon Chile 2026</div><div class="c">14 nov</div></div>
</div>
</html>
