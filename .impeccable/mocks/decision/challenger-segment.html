<!doctype html><html lang="es"><meta charset="utf-8"><title>Marcador</title>
<style>
*{box-sizing:border-box;margin:0}body{width:1600px;height:900px;background:#111211;color:#f4f1e8;font-family:"Barlow Condensed","Helvetica Neue",Arial,sans-serif;overflow:hidden;position:relative}
h1{position:absolute;left:80px;top:70px;font-size:64px;font-weight:800;letter-spacing:.01em;text-transform:uppercase}
.board{position:absolute;left:80px;right:80px;top:200px;height:520px;display:grid;grid-template-columns:1fr 1fr;gap:40px}
.side{background:#1b1c1a;border:2px solid #2c2d2a;padding:40px}
.k{font-size:40px;font-weight:700;color:#a6a397;text-transform:uppercase}
.d{font-family:"DSEG7 Classic",monospace;font-size:200px;color:#ffb000;line-height:1.1;margin-top:30px;letter-spacing:.04em}
.d.g{color:#2fe07a}.ghost{color:#2a2a24}
.f{position:absolute;left:80px;bottom:70px;font-size:34px;font-weight:700;color:#a6a397}
</style>
<h1>Misma app, dos resultados distintos</h1>
<div class="board"><div class="side"><div class="k">Versión A · MiB por pod</div><div class="d">1375</div></div><div class="side"><div class="k">Versión B · MiB por pod</div><div class="d g"><span class="ghost">00</span>90</div></div></div>
<div class="f">PyCon Chile 2026 · Santiago</div>
</html>
