<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Misma app · pantalla</title>
<style>
  :root {
    --bg: #1d1846; --panel: #262058; --line: #3a3378; --text: #f5f3ff; --muted: #a9a3d9;
    --cyan: #4dd0e1; --orange: #f9a825; --ok: #5ce1a6; --lost: #ff5c7a;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(90% 70% at 50% 0%, #2c2470 0%, var(--bg) 65%);
    color: var(--text); font-family: var(--mono); overflow: hidden;
    display: grid; grid-template-rows: auto 1fr auto; gap: 2vh; padding: 3vh 3vw;
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 2vw; }
  .event { color: var(--cyan); font-size: 1.6vh; letter-spacing: .16em; text-transform: uppercase; }
  h1 { margin: .6vh 0 0; font-size: 4vh; font-weight: 600; }
  .join { display: flex; align-items: center; gap: 1.4vw; text-align: right; }
  .join p { margin: 0; font-size: 1.9vh; color: var(--muted); line-height: 1.5; }
  .join strong { color: var(--text); font-size: 2.4vh; }
  .join img { height: 14vh; border-radius: 1vh; background: #fff; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 3vw; min-height: 0; }
  .panel {
    display: grid; grid-template-rows: auto 1fr auto; gap: 1.8vh; min-height: 0;
    background: rgba(38, 32, 88, .7); border: 1px solid var(--line); border-radius: 2vh; padding: 2.2vh 2vw;
    transition: border-color .4s ease, box-shadow .4s ease;
  }
  .panel.bad { border-color: var(--lost); box-shadow: 0 0 0 1px var(--lost), 0 0 6vh rgba(255, 92, 122, .18); }
  .panel.good { border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok), 0 0 6vh rgba(92, 225, 166, .15); }
  .title { display: flex; align-items: center; gap: 1.2vw; }
  .badge {
    width: 6vh; height: 6vh; border-radius: 1.4vh; display: grid; place-items: center;
    background: var(--line); font-size: 3.4vh; font-weight: 700;
  }
  .label { font-size: 3vh; font-weight: 600; }
  .label small { display: block; font-size: 1.7vh; font-weight: 400; color: var(--muted); margin-top: .3vh; }
  .bad .label { color: var(--lost); } .good .label { color: var(--ok); }
  .art { display: grid; place-items: center; min-height: 0; }
  canvas {
    height: 100%; max-height: 100%; aspect-ratio: 1; max-width: 100%;
    image-rendering: pixelated; border-radius: 1vh; background: #15122e;
  }
  .progress { margin-left: auto; font-size: 1.9vh; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1vw; }
  .stat { background: rgba(21, 18, 46, .55); border-radius: 1.2vh; padding: 1.2vh 1vw; }
  .stat span { display: block; font-size: 1.5vh; color: var(--muted); }
  .stat b { display: block; font-size: 3.6vh; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: .4vh; white-space: nowrap; }
  .stat b.ok { color: var(--ok); } .stat b.lost { color: var(--lost); } .stat b.warn { color: var(--orange); }
  footer { display: flex; justify-content: space-between; font-size: 1.5vh; color: var(--muted); }
  .dot { display: inline-block; width: 1vh; height: 1vh; border-radius: 50%; background: var(--lost); margin-right: .6vw; vertical-align: middle; }
  .dot.live { background: var(--ok); }
  kbd { border: 1px solid var(--line); border-radius: .5vh; padding: 0 .5vh; color: var(--text); }
  .legend { margin-left: 2vw; }
  .legend i { display: inline-block; width: 1.2vh; height: 1.2vh; background: rgb(255, 72, 104); margin-right: .5vw; vertical-align: middle; }
</style>
</head>
<body>
<header>
  <div>
    <div class="event">PyCon Chile 2026</div>
    <h1>Misma app, dos resultados distintos</h1>
  </div>
  <div class="join">
    <p>Escanea y toca <strong>COMPRAR</strong><br>cada toque es una orden real<br>enviada igual a A y a B</p>
    <img src="qr.svg" alt="Código QR para participar">
  </div>
</header>

<main id="panels"></main>

<footer>
  <div><span class="dot" id="dot"></span><span id="status">conectando…</span><span class="legend"><i></i>orden perdida</span></div>
  <div id="controls"></div>
</footer>

<script>
  const SIDES = ["A", "B"];
  const COLORS = { empty: [21, 18, 46], lost: [255, 72, 104] };
  const token = new URLSearchParams(location.search).get("token");
  let grid = 0, target = null, targetImage = null, autoplay = 0, revealed = false, lastAutoplay = 20;
  const views = {};

  document.getElementById("panels").innerHTML = SIDES.map((s) => `
    <section class="panel" id="panel-${s}">
      <div class="title"><div class="badge">${s}</div><div class="label" id="label-${s}">Versión ${s}<small>misma app.py</small></div><div class="progress" id="progress-${s}"></div></div>
      <div class="art"><canvas id="canvas-${s}"></canvas></div>
      <div class="stats">
        <div class="stat"><span>órdenes ok</span><b class="ok" id="ok-${s}">0</b></div>
        <div class="stat"><span>perdidas</span><b id="lost-${s}">0</b></div>
        <div class="stat"><span>p95 (10 s)</span><b id="p95-${s}">—</b></div>
        <div class="stat"><span>en espera</span><b id="flight-${s}">0</b></div>
      </div>
    </section>`).join("");

  function loadTarget() {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.src = "static/target.png";
    });
  }

  function setup(size, img) {
    grid = size;
    const off = document.createElement("canvas");
    off.width = off.height = grid;
    const ctx = off.getContext("2d");
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, 0, 0, grid, grid);
    target = ctx.getImageData(0, 0, grid, grid).data;
    for (const s of SIDES) {
      const canvas = document.getElementById(`canvas-${s}`);
      canvas.width = canvas.height = grid;
      const context = canvas.getContext("2d");
      views[s] = { context, image: context.createImageData(grid, grid), cells: new Uint8Array(grid * grid), painted: 0, dirty: true };
    }
  }

  function paint(side, cell, value) {
    const view = views[side], data = view.image.data, i = cell * 4;
    if (value === 1 && view.cells[cell] !== 1) view.painted += 1;
    if (value !== 1 && view.cells[cell] === 1) view.painted -= 1;
    view.cells[cell] = value;
    const rgb = value === 1 ? [target[i], target[i + 1], target[i + 2]] : value === 2 ? COLORS.lost : COLORS.empty;
    data[i] = rgb[0]; data[i + 1] = rgb[1]; data[i + 2] = rgb[2]; data[i + 3] = 255;
    view.dirty = true;
  }

  function render() {
    for (const s of SIDES) {
      const view = views[s];
      if (view && view.dirty) {
        view.context.putImageData(view.image, 0, 0);
        document.getElementById(`progress-${s}`).textContent = `${Math.round(100 * view.painted / (grid * grid))}% pintado`;
        view.dirty = false;
      }
    }
    requestAnimationFrame(render);
  }

  function showStats(stats, labels) {
    revealed = SIDES.some((s) => labels[s]);
    for (const s of SIDES) {
      const st = stats[s];
      document.getElementById(`ok-${s}`).textContent = st.ok.toLocaleString("es-CL");
      const lost = document.getElementById(`lost-${s}`);
      lost.textContent = st.lost.toLocaleString("es-CL");
      lost.className = st.lost ? "lost" : "";
      const p95 = document.getElementById(`p95-${s}`);
      p95.textContent = st.p95_ms == null ? "—"
        : st.p95_ms >= 1000 ? `${(st.p95_ms / 1000).toLocaleString("es-CL", { maximumFractionDigits: 1 })} s` : `${st.p95_ms} ms`;
      p95.className = st.p95_ms > 1000 ? "lost" : st.p95_ms > 400 ? "warn" : "";
      const flight = document.getElementById(`flight-${s}`);
      flight.textContent = st.in_flight;
      flight.className = st.in_flight > 50 ? "warn" : "";
      const panel = document.getElementById(`panel-${s}`);
      const name = labels[s];
      panel.className = `panel ${name === "mala" ? "bad" : name === "buena" ? "good" : ""}`;
      document.getElementById(`label-${s}`).innerHTML = name
        ? `Versión ${s} · ${name}<small>misma app.py, otro despliegue</small>`
        : `Versión ${s}<small>misma app.py</small>`;
    }
  }

  function showControls() {
    if (!token) return;
    document.getElementById("controls").innerHTML =
      `<kbd>espacio</kbd> auto ${autoplay ? `${autoplay}/s` : "off"} · <kbd>↑</kbd><kbd>↓</kbd> ritmo · <kbd>r</kbd> revelar · <kbd>x</kbd><kbd>x</kbd> reiniciar`;
  }

  function onMessage(event) {
    const msg = JSON.parse(event.data);
    if (msg.grid && msg.grid !== grid) setup(msg.grid, targetImage);
    if (msg.snapshot) {
      for (const s of SIDES) {
        const cells = Uint8Array.from(atob(msg.snapshot[s]), (c) => c.charCodeAt(0));
        views[s].cells.fill(0); views[s].painted = 0;
        cells.forEach((value, cell) => paint(s, cell, value));
      }
    }
    if (msg.cells) for (const s of SIDES) for (const [cell, value] of msg.cells[s]) paint(s, cell, value);
    autoplay = msg.autoplay;
    showStats(msg.stats, msg.labels);
    showControls();
  }

  function connect() {
    const source = new EventSource("events");
    source.onopen = () => { document.getElementById("dot").className = "dot live"; document.getElementById("status").textContent = "en vivo"; };
    source.onerror = () => { document.getElementById("dot").className = "dot"; document.getElementById("status").textContent = "reconectando…"; };
    source.onmessage = onMessage;
  }

  async function control(body) {
    await fetch("admin", { method: "POST", headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` }, body: JSON.stringify(body) });
  }

  let resetArmed = 0;
  document.addEventListener("keydown", (e) => {
    if (!token) return;
    if (e.key === " ") { e.preventDefault(); if (autoplay) lastAutoplay = autoplay; control({ autoplay: autoplay ? 0 : lastAutoplay }); }
    if (e.key === "ArrowUp") control({ autoplay: Math.min(1000, (autoplay || 0) + 10) });
    if (e.key === "ArrowDown") control({ autoplay: Math.max(0, (autoplay || 0) - 10) });
    if (e.key === "r") control({ revealed: !revealed });
    if (e.key === "x") {
      if (Date.now() - resetArmed < 1500) { control({ reset: true }); resetArmed = 0; } else resetArmed = Date.now();
    }
  });

  loadTarget().then((img) => {
    targetImage = img;
    render();
    connect();
  });
</script>
</body>
</html>
