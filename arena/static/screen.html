<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resultados · PyCon Chile</title>
<style>
  @font-face { font-family: "Archivo Variable"; src: url("static/fonts/archivo-latin-wdth-normal.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
  @font-face { font-family: "JetBrains Mono Variable"; src: url("static/fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2"); font-weight: 100 800; font-display: swap; }
  :root { --ink: #111111; --paper: #ffffff; --loss: #c8102e; --panel: #f1f1f1; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper); color: var(--ink); font: 450 2.4vh/1.35 "Archivo Variable", "Helvetica Neue", sans-serif;
    overflow: hidden; display: grid; grid-template-rows: auto 1fr auto; gap: 2.5vh; padding: 3.5vh 4vw 2.5vh;
  }
  .mono { font-family: "JetBrains Mono Variable", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 3vw; }
  h1 { margin: 0; font-size: 6.4vh; font-weight: 900; line-height: .94; font-variation-settings: "wdth" 72; text-transform: uppercase; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 4vw; min-height: 0; }
  .tabla { border: .45vh solid var(--ink); padding: 1.6vh 2vw; display: grid; grid-template-rows: auto auto 1fr auto; min-height: 0; overflow: hidden; }
  .tabla h2 { margin: 0 0 1vh; font-size: 5.5vh; font-weight: 900; line-height: 1; font-variation-settings: "wdth" 75; text-transform: uppercase; }
  .tabla h2 small { font-size: 2.4vh; font-weight: 600; font-variation-settings: "wdth" 100; text-transform: none; margin-left: 1vw; }
  .headline { border-top: 1.4vh solid var(--ink); border-bottom: .5vh solid var(--ink); padding: 1.2vh 0; display: flex; flex-direction: column; justify-content: center; }
  .headline span, .big span, .small span { display: block; font-size: 2.6vh; font-weight: 800; }
  .headline b { font-size: 14vh; line-height: 1; font-weight: 700; display: block; }
  .headline b.loss { color: var(--loss); }
  .big { display: grid; grid-template-columns: 1fr 1fr; align-content: space-evenly; }
  .big div { padding: 1.4vh 0; }
  .big { column-gap: 2vw; }
  .big b { font-size: min(9.5vh, 3.6vw); line-height: 1; font-weight: 700; display: block; white-space: nowrap; }
  .big b.loss { color: var(--loss); }
  .small { display: grid; grid-template-columns: 1fr 1fr; border-top: .5vh solid var(--ink); padding-top: 1.2vh; }
  .small b { font-size: 6vh; font-weight: 600; }
  footer { display: flex; justify-content: space-between; align-items: center; font-size: 2vh; font-weight: 600; min-height: 3vh; }
  .state::before { content: "● "; }
  .state.off::before { content: "○ "; }
  kbd { font: 600 1.9vh "JetBrains Mono Variable", monospace; border: .2vh solid var(--ink); padding: 0 .6vh; }
</style>
</head>
<body>
<header>
  <h1>Misma app,<br>dos resultados distintos</h1>
</header>

<main id="panels"></main>

<footer>
  <div class="state off" id="status">conectando…</div>
  <div id="controls"></div>
</footer>

<script>
  const SIDES = ["A", "B"];
  const token = new URLSearchParams(location.search).get("token");
  const format = new Intl.NumberFormat("es-CL");
  let autoplay = 0, lastAutoplay = 20;

  document.getElementById("panels").innerHTML = SIDES.map((s) => `
    <section class="tabla">
      <h2>Versión ${s}</h2>
      <div class="headline"><span>cobradas sin orden</span><b class="mono" id="orphans-${s}">—</b></div>
      <div class="big">
        <div><span>órdenes confirmadas</span><b class="mono" id="ok-${s}">0</b></div>
        <div><span>errores</span><b class="mono" id="lost-${s}">0</b></div>
      </div>
      <div class="small">
        <div><span>órdenes por segundo</span><b class="mono" id="rate-${s}">0</b></div>
        <div><span>p95 (10 s)</span><b class="mono" id="p95-${s}">—</b></div>
      </div>
    </section>`).join("");

  function number(id, value) {
    document.getElementById(id).textContent = value == null ? "—" : format.format(value);
  }

  function showStats(stats) {
    for (const s of SIDES) {
      const st = stats[s];
      number(`ok-${s}`, st.ok);
      number(`lost-${s}`, st.lost);
      number(`orphans-${s}`, st.charged_without_order);
      document.getElementById(`orphans-${s}`).classList.toggle("loss", st.charged_without_order > 0);
      document.getElementById(`rate-${s}`).textContent = st.rate.toLocaleString("es-CL", { minimumFractionDigits: 1 });
      document.getElementById(`p95-${s}`).textContent = st.p95_ms == null ? "—"
        : st.p95_ms >= 1000 ? `${(st.p95_ms / 1000).toLocaleString("es-CL", { maximumFractionDigits: 1 })} s` : `${st.p95_ms} ms`;
    }
  }

  function showControls() {
    if (!token) return;
    document.getElementById("controls").innerHTML =
      `<kbd>espacio</kbd> auto ${autoplay ? `${autoplay}/s` : "off"} · <kbd>↑</kbd><kbd>↓</kbd> ritmo · <kbd>x</kbd><kbd>x</kbd> reiniciar`;
  }

  function connect() {
    const status = document.getElementById("status");
    const source = new EventSource("events");
    source.onopen = () => { status.className = "state"; status.textContent = "en vivo"; };
    source.onerror = () => { status.className = "state off"; status.textContent = "reconectando…"; };
    source.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      autoplay = msg.autoplay;
      showStats(msg.stats);
      showControls();
    };
  }

  async function control(body) {
    await fetch("admin", { method: "POST", headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` }, body: JSON.stringify(body) });
  }

  let resetArmed = 0;
  document.addEventListener("keydown", (e) => {
    if (!token) return;
    if (e.key === " ") { e.preventDefault(); if (autoplay) lastAutoplay = autoplay; control({ autoplay: autoplay ? 0 : lastAutoplay }); }
    if (e.key === "ArrowUp") control({ autoplay: Math.min(1000, (autoplay || 0) + 10) });
    if (e.key === "ArrowDown") control({ autoplay: Math.max(0, (autoplay || 0) - 10) });
    if (e.key === "x") {
      if (Date.now() - resetArmed < 1500) { control({ reset: true }); resetArmed = 0; } else resetArmed = Date.now();
    }
  });

  connect();
</script>
</body>
</html>
