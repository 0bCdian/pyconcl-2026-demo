<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Tienda · PyCon Chile</title>
<style>
  @font-face { font-family: "Archivo Variable"; src: url("static/fonts/archivo-latin-wdth-normal.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
  @font-face { font-family: "JetBrains Mono Variable"; src: url("static/fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2"); font-weight: 100 800; font-display: swap; }
  :root { --ink: #111111; --paper: #ffffff; --loss: #c8102e; --panel: #f1f1f1; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper); color: var(--ink); font: 450 16px/1.35 "Archivo Variable", "Helvetica Neue", sans-serif;
    max-width: 480px; margin: 0 auto; min-height: 100dvh;
    padding: max(14px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 14px;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  h1 { margin: 0; font-size: 30px; font-weight: 900; line-height: .94; font-variation-settings: "wdth" 72; text-transform: uppercase; }
  .mono { font-family: "JetBrains Mono Variable", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .product { border: 3px solid var(--ink); padding: 12px 16px 14px; }
  .category { font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
  .name { margin: 2px 0 10px; font-size: 26px; font-weight: 900; line-height: 1; font-variation-settings: "wdth" 75; }
  .facts { border-top: 12px solid var(--ink); display: flex; justify-content: space-between; align-items: baseline; padding-top: 8px; }
  .price { font-size: 34px; font-weight: 700; }
  .rating { font-size: 18px; font-weight: 600; }
  .buy {
    width: 100%; min-height: 76px; border: 3px solid var(--ink); border-radius: 0; background: var(--ink); color: var(--paper);
    font: 900 34px/1 "Archivo Variable", sans-serif; font-variation-settings: "wdth" 75; letter-spacing: .02em; cursor: pointer;
  }
  .buy:active { background: var(--paper); color: var(--ink); }
  .buy:disabled { background: var(--panel); color: var(--ink); cursor: wait; }
  .buy:focus-visible, .receipt:focus-visible { outline: 4px solid var(--ink); outline-offset: 4px; }
  .receipt { border-top: 12px solid var(--ink); border-bottom: 4px solid var(--ink); }
  .receipt h2 { margin: 6px 0; font-size: 15px; font-weight: 800; text-transform: uppercase; }
  .row { display: grid; grid-template-columns: 24px 1fr auto; gap: 8px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--ink); font-size: 15px; }
  .row b { font-size: 20px; font-weight: 900; }
  .row .detail { font-weight: 600; }
  .row.lost { color: var(--loss); font-weight: 700; }
  .tally { grid-column: 2 / 4; font-size: 13px; font-weight: 500; }
  .tally .errors.some { color: var(--loss); font-weight: 700; }
  #note { font-size: 14px; margin: 0; min-height: 38px; }
  #note.warn { font-weight: 800; }
  @media (max-height: 700px) { .name { font-size: 22px; } .price { font-size: 28px; } .buy { min-height: 64px; font-size: 30px; } .row { padding: 5px 0; } }
</style>
</head>
<body>
<h1>Tienda PyCon</h1>

<section class="product" aria-live="polite">
  <div class="category" id="category">cargando…</div>
  <p class="name" id="name">Buscando productos</p>
  <div class="facts"><span class="price mono" id="price">—</span><span class="rating mono" id="rating"></span></div>
</section>

<button class="buy" id="buy" type="button" disabled>COMPRAR</button>

<section class="receipt" aria-live="polite">
  <h2>Tu última compra</h2>
  <div id="rows"></div>
</section>

<p id="note">Cada compra es una orden real, enviada igual a las dos versiones. Mira la pantalla.</p>

<script>
  const SIDES = ["A", "B"];
  const MAX_IN_FLIGHT = 4;
  const note = document.getElementById("note");
  const defaultNote = note.textContent;
  const buyButton = document.getElementById("buy");
  const tally = Object.fromEntries(SIDES.map((s) => [s, { ok: 0, lost: 0 }]));
  const pesos = new Intl.NumberFormat("es-CL", { style: "currency", currency: "CLP", maximumFractionDigits: 0 });
  let catalog = [];
  let product = null;
  let inFlight = 0;
  let noteTimer;

  function randomId() {
    return Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => b.toString(16).padStart(2, "0")).join("");
  }

  function deviceId() {
    try {
      let id = localStorage.getItem("device");
      if (!id) { id = randomId(); localStorage.setItem("device", id); }
      return id;
    } catch { return randomId(); }
  }
  const device = deviceId();

  const rows = document.getElementById("rows");
  rows.innerHTML = SIDES.map((s) => `
    <div class="row" id="row-${s}"><b>${s}</b><span class="detail mono" id="detail-${s}">—</span><span class="mono" id="ms-${s}"></span>
      <div class="tally mono" id="tally-${s}"></div></div>`).join("");
  SIDES.forEach(showTally);

  function showProduct() {
    const category = product.category.charAt(0).toUpperCase() + product.category.slice(1);
    document.getElementById("category").textContent = category;
    document.getElementById("name").textContent = `${category} · producto ${product.id}`;
    document.getElementById("price").textContent = pesos.format(product.price).replace(/\s/g, "");
    document.getElementById("rating").textContent = `★ ${Number(product.rating).toLocaleString("es-CL", { minimumFractionDigits: 1 })}`;
  }

  function nextProduct() {
    product = catalog[Math.floor(Math.random() * catalog.length)];
    showProduct();
  }

  async function loadCatalog() {
    try {
      const response = await fetch("catalog");
      if (response.ok) catalog = await response.json();
    } catch {}
    if (catalog.length) { nextProduct(); buyButton.disabled = false; } else setTimeout(loadCatalog, 2000);
  }

  function warn(text) {
    note.textContent = text; note.classList.add("warn");
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => { note.textContent = defaultNote; note.classList.remove("warn"); }, 1500);
  }

  function showTally(side) {
    const { ok, lost } = tally[side];
    document.getElementById(`tally-${side}`).innerHTML =
      `<b>${ok}</b> confirmadas · <span class="errors ${lost ? "some" : ""}"><b>${lost}</b> con error</span>`;
  }

  function show(side, result) {
    document.getElementById(`row-${side}`).className = `row ${result.ok ? "" : "lost"}`;
    document.getElementById(`detail-${side}`).textContent = result.ok
      ? `✓ orden ${String(result.order_id ?? "").slice(0, 6)}…` : "✗ sin respuesta";
    document.getElementById(`ms-${side}`).textContent = `${result.ms} ms`;
    tally[side][result.ok ? "ok" : "lost"] += 1;
    showTally(side);
  }

  async function buy() {
    if (inFlight >= MAX_IN_FLIGHT || !product) return;
    const product_id = product.id;
    nextProduct();
    inFlight += 1;
    navigator.vibrate?.(8);
    try {
      const response = await fetch("tap", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ device, product_id }),
      });
      if (response.status === 429) { warn("Más despacio: hay mucha gente comprando."); return; }
      if (!response.ok) { warn("La tienda no respondió. Prueba de nuevo."); return; }
      const { results } = await response.json();
      for (const side of SIDES) show(side, results[side]);
    } catch {
      warn("Sin conexión. Prueba de nuevo.");
    } finally {
      inFlight -= 1;
    }
  }

  buyButton.addEventListener("pointerdown", (e) => { e.preventDefault(); buy(); });
  buyButton.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); buy(); } });
  loadCatalog();
</script>
</body>
</html>
